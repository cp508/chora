[package]
name = "chora"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
description = "Lightweight CLI organizer: markdown notes, day events, git sync"
license = "MIT OR BSD-3-Clause"
repository = "https://gitlab.com/gidrex/chora"
homepage = "https://gitlab.com/gidrex/chora"
documentation = "https://docs.rs/chora"

[[bin]]
name = "chora"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "chora"
path = "src/lib.rs"

[features]
default = ["cli"]
cli = [
  "dep:clap",
  "dep:clap_complete",
  "dep:crossterm",
  "dep:ratatui",
  "dep:shell-words",
]

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"], optional = true }
clap_complete = { version = "4", optional = true }
crossterm = { version = "0.29", optional = true }
dirs = "7"
ratatui = { version = "0.30", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = { version = "1", optional = true }
thiserror = "2"
toml = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true

[lints.rust]
missing_docs = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
